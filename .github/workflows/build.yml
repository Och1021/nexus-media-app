# Nexus Media аппыг Windows, Mac дээр бүтээж GitHub Releases-д нийтэлнэ.
# Шинэ хувилбар гаргах: шинэ tag (жишээ нь v1.0.1) push хийхэд л болно. Хувилбарын дугаарыг tag-аас авна.
name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set version and repository
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="$(node -p "require('./package.json').version")"; fi
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
            p.version = process.argv[1];
            p.build.publish = [{ provider: 'github', owner, repo, releaseType: 'release' }];
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2));
          " "$VERSION"
          echo "Version: $VERSION"

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder ${{ matrix.target }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - run: ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          name: Nexus Media ${{ github.ref_name }}
          make_latest: 'true'
          body: |
            Nexus Media компьютерийн апп ${{ github.ref_name }}
            - Windows: NexusMedia-Setup.exe
            - Mac (Apple M чип): NexusMedia-mac-arm64.dmg
            - Mac (Intel): NexusMedia-mac-x64.dmg
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml
