# Nexus Media аппыг Windows, Mac дээр бүтээж GitHub Releases-д нийтэлнэ.
# Шинэ хувилбар гаргах: package.json доторх "version"-ийг нэмээд (жишээ нь 1.0.1) main руу push хийхэд л болно.
# GitHub өөрөө Windows, Mac хувилбарыг бүтээж, v<version> нэртэй release гаргана.
name: Build & Release

on:
  push:
    branches: [main]
    paths: ['package.json', 'main.js', 'preload.js', 'offline.html', 'build/**', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder ${{ matrix.target }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - run: ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Nexus Media v${{ steps.v.outputs.version }}
          make_latest: 'true'
          body: |
            Nexus Media компьютерийн апп v${{ steps.v.outputs.version }}
            - Windows: NexusMedia-Setup.exe
            - Mac (Apple M чип): NexusMedia-mac-arm64.dmg
            - Mac (Intel): NexusMedia-mac-x64.dmg
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml
